    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCDU5f4iBXSwlKYYJUO6bb72r1VBVLAg3I",
      authDomain: "mushafpro-e80e1.firebaseapp.com",
      projectId: "mushafpro-e80e1",
      storageBucket: "mushafpro-e80e1.firebasestorage.app",
      messagingSenderId: "416657395563",
      appId: "1:416657395563:web:842ee40f5e180c22bb862e"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;

    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      const userStatus = document.getElementById('userStatus');
      const authBtn = document.getElementById('authBtn');

      if (user) {
        userStatus.innerText = user.displayName.split(' ')[0];
        authBtn.innerText = "Keluar";
        await loadUserPage(user.uid);
      } else {
        userStatus.innerText = "Tamu";
        authBtn.innerText = "Masuk";
      }
    });

    window.toggleAuth = async function() {
      if (currentUser) {
        await signOut(auth);
      } else {
        try { await signInWithPopup(auth, provider); } catch (e) { console.error("Login gagal", e); }
      }
    }

    window.savePageToCloud = async function(pageNo) {
      if (!currentUser) return;
      try {
        const ref = doc(db, "progres_hafalan", currentUser.uid);
        await setDoc(ref, { halaman_terakhir: pageNo, updated_at: new Date().toISOString() }, { merge: true });
      } catch(e) {}
    }

    async function loadUserPage(uid) {
      try {
        const ref = doc(db, "progres_hafalan", uid);
        const snap = await getDoc(ref);
        if (snap.exists() && snap.data().halaman_terakhir) {
          const hal = snap.data().halaman_terakhir;
          if (hal !== window.halamanAktif) { window.tampilHalaman(hal); }
        }
      } catch(e) {}
    }
  </script>

    const JSON_URL = "https://raw.githubusercontent.com/MohamadHajjRabee/quran-qcf4/main/pages/";
    const FONT_URL = "https://cdn.jsdelivr.net/gh/MohamadHajjRabee/quran-qcf4@main/fonts-woff2/";

    const JARAK_KATA_EM = 0.12;  
    const MIN_JARAK_BARIS = 2.0; 

    const IKON = {
      bulan: '<svg class="ik" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
      matahari: '<svg class="ik" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'

    const input = document.getElementById("halaman");

    let isPlaying = false;
    let audioQueue = [];

    let currentRepeatCount = 0;

    function hitungJuz(no) { return no < 22 ? 1 : Math.min(30, Math.floor((no - 2) / 20) + 1); }

    function judulSurah(teksJudul) {
      const kata = (teksJudul || "").trim().split(/\s+/);
      const polos = k => k.replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g, "");
      const i = kata.findIndex(k => polos(k) === "بسم");
      return (i > 0 ? kata.slice(0, i) : kata).join(" ");
    }

    const dataCache = {};
    const fontCache = {};

    function ambilData(no) {
      if (!dataCache[no]) {
        const nama = String(no).padStart(3, "0");
        dataCache[no] = fetch(JSON_URL + nama + ".json").then(r => {
          if (!r.ok) throw new Error("Gagal ambil json");
          return r.json();
        });
      }
      return dataCache[no];
    }

    function muatFont(nama) {
      if (!fontCache[nama]) {
        const file = nama === "QCF4_QBSML" ? "QCF4_QBSML.woff2" : nama + "_W.woff2";
        const f = new FontFace(nama, `url(${FONT_URL}${file})`);
        fontCache[nama] = f.load().then(ff => { document.fonts.add(ff); return ff; });
      }
      return fontCache[nama];
    }

    function fontHalaman(data) {
      const s = new Set();
      data.lines.forEach(l => l.words.forEach(w => { if (w.type !== "surah_header") s.add(w.font); }));
      return [...s];
    }

    // Mapping penelusuran ayat yang akurat di halaman ini berdasarkan penomoran standar Mushaf Madinah
    function getSurahAndAyahFromPageData(data, halamanNo) {
      const currentSurahObj = DAFTAR_SURAH.slice().reverse().find(s => s.hal <= halamanNo) || DAFTAR_SURAH[0];
      let sNo = currentSurahObj.no;
      
      // Perhitungan estimasi nomor ayat awal halaman berdasarkan halaman Mushaf Madinah standar
      // Untuk simplifikasi ketepatan audio per halaman: kita ambil dari nomor urut ayat yang tampil di halaman tersebut
      let list = [];
      let ayahCount = 1;

      // Jika halaman bukan awal surat, kita estimasi nomor ayat berdasarkan data standar atau mulai dari 1
      data.lines.forEach(line => {
        const header = line.words.find(w => w.type === "surah_header");
        if (header) {
          const foundS = DAFTAR_SURAH.find(s => header.text.includes(s.nama.replace(/[^a-zA-Z]/g, "")));
          if (foundS) sNo = foundS.no;
          ayahCount = 1;
        }
        line.words.forEach(w => {
          const isNomorAyat = w.type === "end" || w.type === "ayah_number" || w.font.includes("QBSML") || /[\u06DD\u06E9]/.test(w.char);
          if (isNomorAyat) {
            list.push({
              surah: sNo,
              ayah: ayahCount,
              url: `https://everyayah.com/data/Alafasy_128kbps/${String(sNo).padStart(3, '0')}${String(ayahCount).padStart(3, '0')}.mp3`
            });
            ayahCount++;
          }
        });
      });
      return list;
    }

    async function renderTeks(no, my) {
      teks.classList.add("memuat");
      const data = await ambilData(no);
      await Promise.all(fontHalaman(data).map(muatFont));
      if (my !== token) return;

      teks.innerHTML = "";
      pageAyahAudioList = getSurahAndAyahFromPageData(data, no);
      
      let tandaiKataPertama = true;
      let ayatCounter = 1;

      data.lines.forEach(line => {
        const baris = document.createElement("div");
        baris.className = "baris";
        const header = line.words.find(w => w.type === "surah_header");
        
        if (header) {
          baris.classList.add("header");
          const b = document.createElement("div");
          b.className = "banner";
          const t = document.createElement("span");
          t.textContent = judulSurah(header.text);
          b.appendChild(t);
          baris.appendChild(b);
          tandaiKataPertama = true;
        } else {
          const isBasmalahLine = line.words.some(w => w.text && (w.text.includes("بِسْمِ") || w.text.includes("بسم") || w.font === "QCF4_QBSML"));
          if (isBasmalahLine) {
            baris.classList.add("basmalah");
          }

          line.words.forEach(w => {
            const k = document.createElement("span");
            k.className = "kata";
            k.style.fontFamily = `"${w.font}"`;
            k.textContent = w.char;
            
            k.onclick = () => k.classList.toggle("terbuka");

            const isNomorAyat = w.type === "end" || w.type === "ayah_number" || w.font.includes("QBSML") || /[\u06DD\u06E9]/.test(w.char);

            if (isNomorAyat) {
              const currentAyatId = `ayat-${no}-${ayatCounter++}`;
              k.classList.add("is-nomor-ayat");
              k.dataset.ayatGroup = currentAyatId;
              
              const audioInfo = pageAyahAudioList[ayatCounter - 2] || pageAyahAudioList[0];
              
              k.onclick = (e) => {
                e.stopPropagation();
                toggleAyatGroup(currentAyatId);
                if (audioInfo) {
                  playSpecificAyat(audioInfo.url);
                }
              };

              tandaiKataPertama = true;
            } else {
              k.dataset.ayatGroup = `ayat-${no}-${ayatCounter}`;
              if (tandaiKataPertama) {
                k.classList.add("is-kata-pertama");
                tandaiKataPertama = false;
              }
            }

            baris.appendChild(k);
          });
        }
        teks.appendChild(baris);
      });

      const namaSurah = (data.surahs && data.surahs.length) ? data.surahs.map(s => s.name).join(" · ") : "";
      activeSurahName = namaSurah;
      document.getElementById("kSurah").textContent = namaSurah;
      document.getElementById("kJuz").textContent = "Juz " + hitungJuz(no);
      document.getElementById("kNo").textContent = no;

      if (data.surahs && data.surahs.length) {
        const surahAktif = DAFTAR_SURAH.slice().reverse().find(s => s.hal <= no);
        if (surahAktif) selectSurah.value = surahAktif.hal;
      }

      atur();
      terapkanModeHafalanUI();
      teks.classList.remove("memuat");
    }

    function toggleAyatGroup(groupId) {
      const kataAyat = document.querySelectorAll(`[data-ayat-group="${groupId}"]`);
      if (!kataAyat.length) return;
      const semuaTerbuka = Array.from(kataAyat).every(k => k.classList.contains("terbuka"));
      kataAyat.forEach(k => {
        if (semuaTerbuka) k.classList.remove("terbuka");
        else k.classList.add("terbuka");
      });
    }

    function lebarAlami(baris, fs) {
      let total = 0;
      baris.querySelectorAll(".kata").forEach(k => { total += k.getBoundingClientRect().width; });
      return total + Math.max(0, baris.children.length - 1) * JARAK_KATA_EM * fs;
    }

    function atur() {
      const lebar = teks.clientWidth;
      if (!lebar) return;
      const semua = [...teks.querySelectorAll(".baris")];
      const isi = semua.filter(b => !b.classList.contains("header"));
      const target = lebar;
      semua.forEach(b => { b.style.width = target + "px"; });
      if (!isi.length) return;

      teks.style.setProperty("--fs", "100px");
      const alami = isi.map(b => lebarAlami(b, 100));
      const maks = Math.max(...alami);
      if (!maks) return;
      let fs = (100 * target / maks) * 0.995;
      teks.style.setProperty("--fs", fs + "px");

      for (let i = 0; i < 20; i++) {
        const meluber = isi.some(b => lebarAlami(b, fs) > target - 0.5);
        if (!meluber) break;
        fs *= 0.985;
        teks.style.setProperty("--fs", fs + "px");
      }

      let hMaks = 0;
      isi.forEach(b => b.querySelectorAll(".kata").forEach(k => { hMaks = Math.max(hMaks, k.getBoundingClientRect().height); }));
      teks.style.setProperty("--pitch", Math.max(MIN_JARAK_BARIS, (hMaks / fs) * 1.1).toFixed(3));
    }

    function tampil(no) {
      if (!(no >= 1 && no <= 604)) { input.value = halaman; return; }
      halaman = no;
      window.halamanAktif = no;
      const my = ++token;

      stopAudio();
      input.value = no;
      info.textContent = `Halaman ${no} dari 604 — Standar Madinah.`;
      document.getElementById("prev").disabled = no <= 1;
      document.getElementById("next").disabled = no >= 604;
      localStorage.setItem("quran_halaman", no);
      
      if (typeof window.savePageToCloud === 'function') {
        window.savePageToCloud(no);
      }

      renderTeks(no, my);
    }
    window.tampilHalaman = tampil;

    window.aturModeHafalan = function(mode) {
      modeHafalan = mode;
      document.getElementById("btnNormal").classList.toggle("aktif-mode", mode === "normal");
      document.getElementById("btnBlur").classList.toggle("aktif-mode", mode === "blur");
      document.getElementById("btnFirstAyat").classList.toggle("aktif-mode", mode === "firstAyat");
      
      document.querySelectorAll("#teks .kata.terbuka").forEach(k => {
        k.classList.remove("terbuka");
      });

      terapkanModeHafalanUI();
    }

    function terapkanModeHafalanUI() {
      teks.classList.remove("blur-total", "kata-pertama-ayat-saja");
      if (modeHafalan === "blur") {
        teks.classList.add("blur-total");
        info.textContent = "Mode Blur: Ketuk nomor ayat untuk buka/tutup atau putar ayat.";
      } else if (modeHafalan === "firstAyat") {
        teks.classList.add("kata-pertama-ayat-saja");
        info.textContent = "Mode Kata Pertama: Ketuk nomor ayat untuk buka/tutup atau putar ayat.";
      } else {
        info.textContent = "Mode Normal: Teks terbuka penuh.";
      }
    }

    function terapkanTema() {
      const isGelap = tema === "dark";
      document.body.classList.toggle("gelap", isGelap);
      document.getElementById("tema").innerHTML = (isGelap ? IKON.matahari : IKON.bulan);
    }

    /* --- SISTEM AUDIO SYAIKH MISYARI RASYID --- */
    window.gantiModeAudio = function() {
      const mode = document.getElementById("audioMode").value;
      document.getElementById("rangeControl").style.display = (mode === "range" ? "flex" : "none");
    }

    function getAudioQueueByMode() {
      const mode = document.getElementById("audioMode").value;
      let urls = [];
      
      if (mode === "page") {
        // Memutar persis urutan ayat yang tampil di halaman aktif saat ini
        urls = pageAyahAudioList.map(item => item.url);
      } else if (mode === "ayah") {
        if (selectedAyahAudioUrl) urls = [selectedAyahAudioUrl];
        else if (pageAyahAudioList.length) urls = [pageAyahAudioList[0].url];
      } else if (mode === "range") {
        let start = parseInt(document.getElementById("startAyat").value) || 1;
        let end = parseInt(document.getElementById("endAyat").value) || start;
        const currentSurahObj = DAFTAR_SURAH.slice().reverse().find(s => s.hal <= halaman) || DAFTAR_SURAH[0];
        let sNo = currentSurahObj.no;
        for (let a = start; a <= end; a++) {
          urls.push(`https://everyayah.com/data/Alafasy_128kbps/${String(sNo).padStart(3, '0')}${String(a).padStart(3, '0')}.mp3`);
        }
      } else if (mode === "surah") {
        const currentSurahObj = DAFTAR_SURAH.slice().reverse().find(s => s.hal <= halaman) || DAFTAR_SURAH[0];
        let sNo = currentSurahObj.no;
        for (let a = 1; a <= 60; a++) {
          urls.push(`https://everyayah.com/data/Alafasy_128kbps/${String(sNo).padStart(3, '0')}${String(a).padStart(3, '0')}.mp3`);
        }
      }
      return urls;
    }

    function playSpecificAyat(url) {
      stopAudio();
      selectedAyahAudioUrl = url;
      audioQueue = [url];
      audioQueueIndex = 0;
      currentRepeatCount = 0;
      loadAndPlayCurrentQueue();
    }

    window.togglePlayAudio = function() {
      if (isPlaying) {
        pauseAudio();
      } else {
        playAudio();
      }
    }

    function playAudio() {
      if (!audioQueue.length) {
        audioQueue = getAudioQueueByMode();
        audioQueueIndex = 0;
      }
      if (!audioQueue.length) return;

      if (!currentAudio) {
        loadAndPlayCurrentQueue();
      } else {
        currentAudio.play();
        isPlaying = true;
        document.getElementById("btnPlayAudio").innerText = "⏸ Pause";
      }
    }

    function loadAndPlayCurrentQueue() {
      if (audioQueueIndex >= audioQueue.length) {
        const maxRepeat = parseInt(document.getElementById("audioRepeat").value);
        if (maxRepeat === 0 || currentRepeatCount < maxRepeat - 1) {
          currentRepeatCount++;
          audioQueueIndex = 0;
        } else {
          stopAudio();
          return;
        }
      }

      const url = audioQueue[audioQueueIndex];
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }

      currentAudio = new Audio(url);
      isPlaying = true;
      document.getElementById("btnPlayAudio").innerText = "⏸ Pause";

      currentAudio.play().catch(e => {
        stopAudio();
      });

      currentAudio.onended = () => {
        audioQueueIndex++;
        loadAndPlayCurrentQueue();
      };
    }

    window.pauseAudio = function() {
      if (currentAudio) {
        currentAudio.pause();
      }
      isPlaying = false;
      document.getElementById("btnPlayAudio").innerText = "▶ Putar";
    }

    window.stopAudio = function() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
      isPlaying = false;
      audioQueue = [];
      audioQueueIndex = 0;
      currentRepeatCount = 0;
      document.getElementById("btnPlayAudio").innerText = "▶ Putar";
    }

    /* Bookmark System */
    function ambilBookmarks() {
      return JSON.parse(localStorage.getItem("quran_bookmarks") || "[]");
    }

    window.simpanHalamanIni = function() {
      const list = ambilBookmarks();
      const item = {
        halaman: halaman,
        surah: activeSurahName || "Surat",
        waktu: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' })
      };
      
      const sudahAda = list.some(b => b.halaman === item.halaman);
      if (!sudahAda) {
        list.push(item);
        localStorage.setItem("quran_bookmarks", JSON.stringify(list));
        alert(`Halaman ${halaman} (${activeSurahName}) berhasil disimpan!`);
      } else {
        alert(`Halaman ${halaman} sudah ada di daftar simpanan.`);
      }
    }

    window.bukaBookmarkModal = function() {
      const modal = document.getElementById("modalBookmark");
      const container = document.getElementById("bookmarkList");
      const list = ambilBookmarks();
      
      container.innerHTML = "";
      if (list.length === 0) {
        container.innerHTML = `<li class="empty-bm">Belum ada ayat atau surat yang disimpan.</li>`;
      } else {
        list.forEach((bm, index) => {
          const li = document.createElement("li");
          li.className = "bookmark-item";
          li.innerHTML = `
            <div class="info-bm" onclick="lompatKeBookmark(${bm.halaman})">
              <span class="title-bm">${bm.surah}</span>
              <span class="sub-bm">Halaman ${bm.halaman} • ${bm.waktu}</span>
            </div>
            <button class="btn-hapus" onclick="hapusBookmark(${index}, event)">&times;</button>
          `;
          container.appendChild(li);
        });
      }
      modal.classList.add("aktif");
    }

    window.tutupBookmarkModal = function() {
      document.getElementById("modalBookmark").classList.remove("aktif");
    }

    window.lompatKeBookmark = function(hal) {
      tampil(hal);
      tutupBookmarkModal();
    }

    window.hapusBookmark = function(index, e) {
      e.stopPropagation();
      const list = ambilBookmarks();
      list.splice(index, 1);
      localStorage.setItem("quran_bookmarks", JSON.stringify(list));
      bukaBookmarkModal();
    }

    document.getElementById("next").onclick = () => tampil(halaman + 1);
    document.getElementById("prev").onclick = () => tampil(halaman - 1);
    input.addEventListener("change", () => tampil(parseInt(input.value)));
    
    selectSurah.addEventListener("change", () => {
      const halTujuan = parseInt(selectSurah.value);
      if (halTujuan) tampil(halTujuan);
    });

    document.getElementById("tema").onclick = () => {
      tema = tema === "dark" ? "light" : "dark";
      localStorage.getItem("quran_tema", tema);
      terapkanTema();
    };

    terapkanTema();
    tampil(halaman);
  </script>
</body>
</html>
